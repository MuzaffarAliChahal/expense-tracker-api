spring:
  application:
    name: expense-tracker-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expenses}
    username: ${DB_USER:expenses}
    password: ${DB_PASSWORD:expenses}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by Flyway
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    # Base64-encoded HMAC key (at least 256 bits). Override with JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:JuJsbVDT4qsrYYJC4G3b9zqBNDtbWysPcJ1438kweyY4tpXKURnqSykoj7H3HYFX}
    expiration: ${JWT_EXPIRATION:PT2H}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
